# WirePlumber rule for ultra-low latency & consistent rhythm gaming audio.
# Place in: ~/.config/wireplumber/wireplumber.conf.d/51-osu-low-latency.conf
#
# Key Features:
# 1. priority.driver = 3000: Ensures DAC/Output drives the PipeWire clock instead
#    of USB microphones (e.g., Fifine/Blue Yeti) or the DAC's own capture channel.
#    Avoids adaptive resampling latency & clock drift.
# 2. api.alsa.disable-tsched = false: Overrides the Pro Audio profile's default
#    (IRQ mode), which locks buffer size at device open time (e.g. 1024 if Discord opens first).
# 3. api.alsa.disable-batch = true: Prevents PipeWire from seeing the snd_usb_audio
#    BATCH flag and automatically doubling ALSA headroom.
# 4. api.alsa.period-size = 32 & headroom = 32: Locks physical ALSA ring buffer to
#    ~226 samples (~5.12ms on USB 2.0 at 44.1kHz), preventing ~27ms hardware buffer bloat.

monitor.alsa.rules = [
  # Demote all USB audio inputs (microphones & DAC capture channels) so they never become clock master
  {
    matches = [
      { node.name = "~alsa_input.usb-.*" }
    ]
    actions = {
      update-props = {
        priority.driver         = 1000
        api.alsa.disable-tsched = false
      }
    }
  }

  # Dedicated USB Audio Interfaces (e.g. Focusrite Scarlett, Motu, Behringer, Schiit, Topping)
  {
    matches = [
      { node.name = "~alsa_output.usb-.*" }
    ]
    actions = {
      update-props = {
        priority.driver         = 3000
        api.alsa.disable-tsched = false
        api.alsa.disable-batch  = true
        api.alsa.period-size    = 32
        api.alsa.headroom       = 32
      }
    }
  }

  # Motherboard / Onboard Audio (e.g. Realtek ALC, Intel HD Audio)
  {
    matches = [
      { node.name = "~alsa_output.pci-.*" }
    ]
    actions = {
      update-props = {
        priority.driver         = 2500
        api.alsa.disable-tsched = false
        api.alsa.disable-batch  = true
        api.alsa.period-size    = 32
        api.alsa.headroom       = 32
      }
    }
  }
]
