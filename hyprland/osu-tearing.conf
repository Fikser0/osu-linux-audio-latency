# Hyprland Low-Latency Rhythm Gaming Rules (Standard Config, Hyprland >= 0.53)
# Add to your ~/.config/hypr/hyprland.conf

# 1. Enable tearing and direct scanout globally
general {
    allow_tearing = true # Required for 'immediate' window rule to take effect
}

render {
    direct_scanout = true # Bypass compositor for fullscreen games (keep display at 8-bit SDR)
}

cursor {
    no_hardware_cursors = false
    use_cpu_buffer = 0
}

# 2. Window rules for osu! and osu!lazer
# 'immediate yes' enables Wayland tearing presentation (wp_tearing_control_v1),
# bypassing compositor mailbox/vsync buffering.
windowrule = match:class ^(osu!)$, immediate yes, content game, idle_inhibit focus
windowrule = match:class ^(sh\.ppy\.osu)$, immediate yes, content game, idle_inhibit focus # Flatpak
windowrule = match:class ^(osu-lazer)$, immediate yes, content game, idle_inhibit focus

# 3. Raw 1:1 mouse input settings
# Note: Do NOT enable legacy 'force_no_accel = true' alongside 'accel_profile = flat';
# it can cause XWayland cursor position desynchronization.
input {
    accel_profile = flat
    sensitivity = 0.0
    follow_mouse = 1
}

# 4. Display & VRR notes:
# Set your monitor to its highest native refresh rate (e.g., 2560x1440@360) in 8-bit SDR.
# Keep VRR disabled (vrr = 0) to avoid frame pacing jitter during tearing.
misc {
    vrr = 0
}
