# Hyprland Low-Latency Rhythm Gaming Rules (Standard Syntax)
# Add to your ~/.config/hypr/hyprland.conf

# 1. Enable tearing globally
general {
    allow_tearing = true # Required for 'immediate' window rule to take effect
}

# 2. Window rules for osu! and osu!lazer
# 'immediate' triggers Wayland tearing presentation (wp_tearing_control_v1),
# completely bypassing compositor mailbox/vsync presentation buffering.
windowrulev2 = immediate, class:^(osu!)$
windowrulev2 = immediate, class:^(sh\.ppy\.osu)$ # Flatpak build
windowrulev2 = immediate, class:^(osu-lazer)$

# Optional: Disable idle inhibition / screensaver while in game
windowrulev2 = idleinhibit always, class:^(osu!)$

# 3. Raw 1:1 mouse input settings
# Note: Do NOT enable 'force_no_accel = true' alongside 'accel_profile = flat';
# it is a legacy bypass that can cause XWayland cursor position desynchronization.
input {
    accel_profile = flat
    sensitivity = 0.0
    follow_mouse = 1
}

# 4. Display & VRR notes:
# Set your monitor to its highest native refresh rate (e.g., 2560x1440@180).
# For rhythm games, VRR (Variable Refresh Rate / Adaptive Sync) is often best
# turned off (vrr = 0) to avoid frame-time pacing jitter during tearing.
misc {
    vrr = 0
}
